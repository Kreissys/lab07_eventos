{% extends "eventos/base.html" %}
{% block title %}Registrarme{% endblock %}
{% block content %}
<div class="card p-4 form-wrap">
  <h1 class="h4 mb-3">Crear cuenta</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-shadow" type="submit">Crear cuenta</button>
    <a class="btn btn-outline-secondary" href="{% url 'login' %}">Ya tengo cuenta</a>
  </form>
</div>
{% endblock %}
