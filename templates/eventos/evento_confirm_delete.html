{% extends "eventos/base.html" %}
{% block title %}Eliminar evento{% endblock %}
{% block content %}
<h1>Eliminar evento</h1>
<p>¿Seguro que deseas eliminar "{{ object.titulo }}"?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn" type="submit">Sí, eliminar</button>
  <a class="btn" href="{% url 'eventos:detalle' object.pk %}">Cancelar</a>
</form>
{% endblock %}
